name: Playwright E2E

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/app/**/*.py'
      - 'frontend/src/**/*.tsx'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/playwright-e2e.yml'

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright Browsers
        run: cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Start Backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://flowboard:flowboard@localhost:5432/flowboard_test
        run: |
          for i in $(seq 1 15); do
            if pg_isready -h localhost -U flowboard -d flowboard_test > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          uv run alembic upgrade head
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Run E2E Tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright test
